<div class="layout coluna">

    <div class="topo">
      <div class="modelo coluna">
        <h3>Informe o modelo:</h3>
        <input type="text" placeholder="Modelo do instrumento">
      </div>
      <div *ngIf="instrument">

      </div>
      <h1 *ngIf="instrument" class="nome_instrumento">{{instrument.nameInstrument}}</h1>
      <img *ngIf="instrument" class="icone_instrumento" [src]=instrument.imageUrl>
      <input *ngIf="!instrument" type="text" value="Informe o nome do instrumento">
      <img *ngIf="!instrument" src="../../../assets/outros.svg" alt="">
    </div>
    <div class="principal">
      <div class="efeitos_especif">
        <h3>Efeitos/Especificações</h3>
        <div class="efeitos_lista">
          <button class="add_efeito">
            <h3>Adicione efeito</h3>
            <img src="../../../assets/REAL_black_add.svg" alt="">
          </button>
        </div>
        <input class="salvar_configuracao" type="submit" value="Salvar configuração">
      </div>
  
      <div class="linha_vertical"></div>
  
      <div class="conteudo">
        <div class="nome_efeito"><input class="input_param" (input)="nomeEfeito($event)" placeholder="Informe o nome do efeito" required><span *ngIf="!nomeEscrito" class="required">*</span>
        </div>
        <div class="linha_horizontal"></div>
        <div class="parametros coluna">
          <div class="parametro">
            <input (input)="parametroInput($event)" class="input_param input_parametro" [(ngModel)]="chave" placeholder="Parâmetro">
            <span>:</span>
            <input class="input_param input_valor" [(ngModel)]="valor" placeholder="Valor">
            <button (click)="adicionarParametro(chave, valor)"><img src="../../../assets/REAL_black_add.svg" alt=""></button>
          </div>
          <div class="parametro" *ngFor="let param of effect.parametros">
              <h2>{{param.chave}}:</h2><p>{{param.valor}}</p>
          </div>
        </div>  
      </div>
    </div>
  </div>
