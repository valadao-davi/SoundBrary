<ng-container  *ngIf="dissayData">
  <button (click)="navigateDissay(dissayId)" class="dissay">
    <div class="topo">
      <div class="topo_textos">
        <h3>{{dissayData.name}}</h3>
        <div class="info_perfil">
          <img *ngIf="userImage.length === 0" src="../../../assets/perfil_icon.png">
          <img *ngIf="userImage.length > 0" [src]="userImage">
  
          <div class="info_perfil_texto"><span>{{userName}} </span>- atualizado em: <span>{{dissayData.createdAt}}</span></div>
        </div>
      </div>
      <div class="topo_avaliacao">
        <div class="estrelas" *ngIf="dissayData.totalRate && dissayData.totalRate > 0">
          <div *ngFor="let i of [1,2,3,4,5]">
            <img *ngIf="dissayData.totalRate && dissayData.totalRate >=i" src="../../../assets/estrela_cheia.svg">
            <img *ngIf="dissayData.totalRate && dissayData.totalRate < i"  src="../../../assets/estrela_vazia.svg">
          </div>
        </div>
        <div class="estrelas" *ngIf="dissayData.totalRate === 0">
          <div *ngFor="let i of [1,2,3,4,5]">
            <img src="../../../assets/estrela_vazia.svg">
          </div>
        </div>
        <h4>{{dissayData.totalRate}}</h4>
      </div>
    </div>
  
    <div class="conteudo">
      <div class="instrumentos" >
        <app-instrumento-mini class="instrumentos" *ngFor="let instrument of dissayData.instruments | slice:0:3" [instrumentDefault]="instrument.defaultInstrument"></app-instrumento-mini>
        <div class="instrumento_mini" *ngIf="dissayData.instruments.length > 3" >
          <h1>...</h1>
          <h5>Outros</h5>
        </div>
      </div>
      <div class="texto_dissay">{{desc}}</div>
    </div>
  </button>
</ng-container>
